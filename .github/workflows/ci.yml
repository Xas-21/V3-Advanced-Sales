# Plan 040 verification gate.
# Typecheck is ratchet mode (continue-on-error): baseline 50 errors as of 2026-07-19.
# Flip to blocking once `npm run typecheck` reaches zero.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Typecheck (ratchet — reporting only; baseline 50 tsc errors)
        continue-on-error: true
        run: npm run typecheck
      # Lint script keeps --max-warnings 0; brownfield still has thousands of
      # warn-level findings. continue-on-error until the lint ratchet hits zero.
      - name: Lint (ratchet — reporting only until warning count is zero)
        continue-on-error: true
        run: npm run lint
      - run: npm run test:frontend
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: as_owner
          POSTGRES_PASSWORD: ci_throwaway_password
          POSTGRES_DB: as-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U as_owner -d as-postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://as_owner:ci_throwaway_password@localhost:5432/as-postgres
      SESSION_SECRET: ci-throwaway-session-secret-not-for-prod
      # Match test_api_full.login CORS preflight expectation (default in that test).
      CORS_ORIGINS: https://app.as-saas.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend deps
        run: pip install -r backend/requirements.txt
      # Fresh CI Postgres has no tables. Local Docker already has schema from
      # prior migrates/restores — CI must apply SQL first or every test fails
      # with UndefinedTable (users/properties).
      - name: Apply relational schema
        env:
          PGPASSWORD: ci_throwaway_password
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql -h localhost -U as_owner -d as-postgres -v ON_ERROR_STOP=1 \
            -f backend/migrations/001_normalized_schema.sql
          psql -h localhost -U as_owner -d as-postgres -v ON_ERROR_STOP=1 \
            -f migrations/004_tenant_columns.sql
          psql -h localhost -U as_owner -d as-postgres -v ON_ERROR_STOP=1 \
            -f migrations/005_sessions_reconcile.sql
      - name: Pytest
        working-directory: backend
        run: python -m pytest tests -q
