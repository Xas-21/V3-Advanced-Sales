# Plan 040 verification gate.
# Typecheck: blocking (zero errors required).
# Lint: blocking ratchet at --max-warnings 2319 (brownfield warn baseline; fail if count rises).
# Backend pytest: still reporting-only until fresh-CI schema drift is resolved.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint (warn ratchet — max-warnings 2319)
        run: npm run lint
      - run: npm run test:frontend
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: as_owner
          POSTGRES_PASSWORD: ci_throwaway_password
          POSTGRES_DB: as-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U as_owner -d as-postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://as_owner:ci_throwaway_password@localhost:5432/as-postgres
      SESSION_SECRET: ci-throwaway-session-secret-not-for-prod
      # Match test_api_full.login CORS preflight expectation (default in that test).
      CORS_ORIGINS: https://app.as-saas.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend deps
        run: pip install -r backend/requirements.txt
      # Fresh CI Postgres has no tables. Local Docker already has schema from
      # prior migrates/restores — CI must apply SQL first or every test fails
      # with UndefinedTable (users/properties).
      - name: Apply relational schema
        env:
          PGPASSWORD: ci_throwaway_password
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql -h localhost -U as_owner -d as-postgres -v ON_ERROR_STOP=1 \
            -f backend/migrations/001_normalized_schema.sql
          psql -h localhost -U as_owner -d as-postgres -v ON_ERROR_STOP=1 \
            -f migrations/004_tenant_columns.sql
          psql -h localhost -U as_owner -d as-postgres -v ON_ERROR_STOP=1 \
            -f migrations/005_sessions_reconcile.sql
      # Ratchet (like frontend lint): the suite assumes a fully
      # migrated DB, and the repo has schema drift between 001_normalized_schema.sql
      # (typed tables) and utils.py's legacy payload tables, which a fresh CI DB
      # exposes as `column "payload" does not exist`. Runs + reports, but does not
      # block until the schema-drift finding is fixed and a faithful schema is applied.
      - name: Pytest (ratchet — reporting only until backend schema drift is resolved)
        continue-on-error: true
        working-directory: backend
        run: python -m pytest tests -q
