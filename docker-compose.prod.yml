# Production stack — static frontend (no npm run dev).
# Usage (from repo root, with production .env):
#   docker compose -f docker-compose.prod.yml up -d --build
#
# App: http://HOST/   API: http://HOST/api/   WS: ws://HOST/ws

services:
  # App DB (V3): reuse the EXISTING container identity + volume from the dev
  # docker-compose.yml. Same creds/volume so prod mounts the real data, not a
  # fresh empty DB. Network alias `as-postgres` matches DATABASE_URL host.
  as-postgres:
    image: postgres:18-alpine
    container_name: as-postgres-v3
    environment:
      - POSTGRES_USER=neondb_owner
      - POSTGRES_PASSWORD=${V3_DB_PASSWORD}
      - POSTGRES_DB=neondb
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U neondb_owner -d neondb
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - as-postgres-v3-data:/var/lib/postgresql
    networks:
      default:
        aliases:
          - as-postgres
    # Do not publish Postgres to the host in production unless you need admin access.

  as-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: as-backend
    environment:
      - USE_FILE_STORAGE=false
      - DATABASE_URL=${DATABASE_URL}
      - SESSION_SECRET=${SESSION_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - UPLOADS_DIR=/data/uploads
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    volumes:
      - as-uploads-data:/data/uploads
    depends_on:
      as-postgres:
        condition: service_healthy
    # Behind nginx; expose only if you need direct API access:
    # ports:
    #   - 127.0.0.1:8000:8000

  # TLS is terminated by the owner's existing Traefik (external network).
  # No raw host port publish; Traefik routes ${APP_DOMAIN} -> this nginx.
  # nginx proxies /api and upgrades /ws to as-backend (HTTP/1.1 keeps headers).
  as-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend.prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: as-frontend
    restart: unless-stopped
    depends_on:
      as-backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://localhost/
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - default
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      # Owner fills: APP_DOMAIN and the certresolver name below.
      - traefik.http.routers.as-frontend.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.as-frontend.entrypoints=websecure
      - traefik.http.routers.as-frontend.tls=true
      - traefik.http.routers.as-frontend.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.services.as-frontend.loadbalancer.server.port=80

networks:
  # Owner's existing Traefik network (created outside this stack).
  traefik:
    external: true

volumes:
  as-postgres-v3-data:
    name: as-postgres-v3-data
    external: true
  as-uploads-data:
