services:
  # Live local DB: container as-postgres-V2 / volume as-postgres-v2-data.
  # Alias `as-postgres` matches DATABASE_URL host. User/db come from .env
  # (existing volume keeps its original role — do not recreate this volume casually).
  as-postgres:
    image: postgres:18-alpine
    container_name: as-postgres-V2
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-as_owner}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-as-postgres}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    ports:
      - 127.0.0.1:5433:5432
    volumes:
      - as-postgres-v2-data:/var/lib/postgresql
    networks:
      default:
        aliases:
          - as-postgres

  as-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: as-backend
    # Local: reload on ./backend mounts (prod compose uses image CMD without reload)
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - USE_FILE_STORAGE=false
      - DATABASE_URL=${DATABASE_URL}
      - SESSION_SECRET=${SESSION_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - UPLOADS_DIR=/data/uploads
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    ports:
      - 8000:8000
    volumes:
      - ./backend:/app
      - as-uploads-data:/data/uploads
    depends_on:
      as-postgres:
        condition: service_healthy

  as-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: as-frontend
    # Local feature work only — Vite HMR. For production see docker-compose.prod.yml
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: npm run dev -- --host 0.0.0.0
    restart: unless-stopped
    ports:
      - 5173:5173
    volumes:
      - ./:/app
      - as-frontend-node-modules:/app/node_modules
    depends_on:
      - as-backend

volumes:
  as-frontend-node-modules:
  as-postgres-v2-data:
  as-uploads-data:
